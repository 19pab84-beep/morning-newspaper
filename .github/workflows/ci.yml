name: Testy generatora
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript fonts-dejavu-core
          python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python src/build.py --demo --date 2026-10-10 --output /tmp/poranna-prasa-test
      - name: Verify manifest and multipage PRN
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('/tmp/poranna-prasa-test')
          m=json.loads((p/'latest.json').read_text())
          b=(p/'gazeta.prn').read_bytes()
          assert m['is_demo'] is True
          assert 2 <= m['pages'] <= 8
          assert len(b) == m['prn_bytes']
          assert hashlib.sha256(b).hexdigest() == m['prn_sha256']
          assert b.count(b'1030M\x0c') == m['pages']
          print('OK:', m['pages'], 'pages')
          PY
