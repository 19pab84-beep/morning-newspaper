name: Poranna Prasa — codzienne wydanie

on:
  workflow_dispatch:
  schedule:
    # IANA timezone: bez ręcznego przestawiania czasu letniego/zimowego.
    - cron: '17 5 * * *'
      timezone: 'Europe/Warsaw'
    - cron: '47 5 * * *'
      timezone: 'Europe/Warsaw'

concurrency:
  group: poranna-prasa
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PRESS_BASE_URL: ${{ vars.PRESS_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    outputs:
      built: ${{ steps.eligibility.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Przeciwdziałanie drugiemu identycznemu wydaniu
        id: eligibility
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif python src/should_build.py "$PRESS_BASE_URL"; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Pakiety systemowe
        if: steps.eligibility.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ghostscript fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Zbuduj PDF + PRN + manifest
        if: steps.eligibility.outputs.build == 'true'
        run: python src/build.py --output public --base-url "$PRESS_BASE_URL"
      - name: Publikuj artefakt stron GitHub Pages
        if: steps.eligibility.outputs.build == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.built == 'true'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
